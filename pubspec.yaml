name: btg_funds_app
description: BTG Pactual — Gestión de fondos FPV/FIC (prueba técnica PersonalSoft)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  dio: ^5.7.0
  fl_chart: ^0.69.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  freezed_annotation: ^2.4.4
  go_router: ^14.2.7
  intl: ^0.19.0
  json_annotation: ^4.9.0
  shared_preferences: ^2.3.2
  uuid: ^4.5.1

dev_dependencies:
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  freezed: ^2.5.7
  integration_test:
    sdk: flutter
  json_serializable: ^6.8.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/mocks/
    - assets/images/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false   # No publicamos a iOS, skip
  image_path: "assets/images/btg-icon.png"

  # Adaptive icon Android (API 26+)
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/btg-icon.png"

  # Web favicon + PWA icons
  web:
    generate: true
    image_path: "assets/images/btg-icon.png"
    background_color: "#0B0B0F"   # AppColors.brandBlack
    theme_color: "#0B0B0F"
